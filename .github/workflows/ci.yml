name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Test
        run: swift test
      - name: Build app
        run: bash scripts/build-app.sh
